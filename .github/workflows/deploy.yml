name: Deploy theme to WHMCS

# Pushes the theme straight to the live server over FTPS whenever main changes.
#
# SETUP (once, by the repo owner - no credentials are ever shared with anyone):
#   1. In cPanel, create a dedicated FTP account with its Directory set to
#      public_html (i.e. /home/<user>/public_html). Do NOT reuse your main
#      cPanel login.
#
#      NOTE ON PATHS: cPanel decides an FTP account's login directory itself,
#      and often appends the username or bases it on the wrong docroot - so do
#      not assume it is public_html. The workflow therefore uses an ABSOLUTE
#      path by default: /home/hostdigi/public_html/.
#
#      If your server jails FTP accounts to their login directory, that
#      absolute path will fail. In that case set the repository VARIABLE
#      FTP_ROOT (Settings > Secrets and variables > Actions > Variables tab)
#      to "./" and make sure the account's directory really is public_html.
#   2. In GitHub: repo Settings > Secrets and variables > Actions > New
#      repository secret. Add:
#         FTP_SERVER    e.g. ftp.hostdigi.co.za
#         FTP_USERNAME  the FTP account's username
#         FTP_PASSWORD  the FTP account's password
#   3. Push to main. The theme deploys automatically.
#
# Secrets are write-only: once saved, nobody can read them back out of GitHub,
# including anyone who can see this file. Revoke access at any time by deleting
# the FTP account in cPanel.
#
# If your host blocks FTPS, delete this workflow and use the cPanel Git Version
# Control route in INSTALL-CPANEL.md instead.

on:
  push:
    branches: [main]
    paths:
      - 'whmcs-theme/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:        # lets you trigger a deploy by hand from the Actions tab
    inputs:
      dry_run:
        description: 'List what would be transferred without writing anything'
        type: boolean
        default: false

concurrency:
  group: deploy-whmcs       # never let two deploys overlap on the server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync theme files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          dry-run: ${{ inputs.dry_run == true }}
          local-dir: ./whmcs-theme/templates/hostdigi/
          # FTP_ROOT is a repository VARIABLE (Settings > Secrets and variables >
          # Actions > Variables), not a secret - it is only a path.
          # Default is the absolute path to the WHMCS root, which works when the
          # FTP account is not jailed to its login directory. If your account IS
          # jailed to public_html, set FTP_ROOT to an empty value or to "./".
          server-dir: ${{ vars.FTP_ROOT || '/home/hostdigi/public_html/' }}templates/hostdigi/
          dangerous-clean-slate: false

      - name: Sync the hook
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          dry-run: ${{ inputs.dry_run == true }}
          local-dir: ./whmcs-theme/includes/hooks/
          server-dir: ${{ vars.FTP_ROOT || '/home/hostdigi/public_html/' }}includes/hooks/
          dangerous-clean-slate: false

      - name: Done
        run: |
          echo "Deployed. If styling looks stale, clear the WHMCS template cache:"
          echo "Utilities > System > System Cleanup, or empty public_html/templates_c/"
